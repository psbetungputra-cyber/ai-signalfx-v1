<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AiSignalFx - Pro Terminal v12.0</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://s3.tradingview.com/tv.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        :root { --sidebar-bg: #ffffff; --main-bg: #f8fafc; --accent-blue: #3b82f6; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--main-bg); color: #1e293b; margin: 0; overflow: hidden; }
        #sidebar { background: var(--sidebar-bg); border-right: 1px solid #e2e8f0; transition: 0.3s ease; z-index: 50; }
        .nav-item { color: #64748b; cursor: pointer; display: flex; align-items: center; gap: 12px; padding: 12px 24px; font-size: 13px; font-weight: 600; }
        .nav-active { color: var(--accent-blue) !important; background: #eff6ff !important; border-right: 4px solid var(--accent-blue); }
        .page { display: none; height: 100vh; overflow-y: auto; padding: 20px; animation: fadeIn 0.3s ease; padding-bottom: 100px; }
        .page.active { display: block; }
        .glass-card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 24px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05); margin-bottom: 20px; }
        .ticker-wrap { background: #1e293b; color: #3b82f6; padding: 5px 0; font-size: 10px; font-weight: 800; overflow: hidden; white-space: nowrap; }
        .ticker-move { display: inline-block; animation: ticker 30s linear infinite; }
        @keyframes ticker { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .wa-float { position: fixed; bottom: 20px; right: 20px; background: #25d366; color: white; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; z-index: 100; }
        @media (max-width: 1024px) { #sidebar { position: fixed; left: -100%; height: 100vh; width: 260px; } #sidebar.open { left: 0; } }
    </style>
</head>
<body class="flex h-screen">

    <div id="login-screen" class="fixed inset-0 z-[999] flex items-center justify-center bg-slate-900 p-6">
        <div class="w-full max-w-md bg-white p-10 rounded-[40px] shadow-2xl text-center">
            <h1 class="text-2xl font-800 text-blue-600 mb-2 italic uppercase">AiSignalFx <span class="text-slate-900">PRO</span></h1>
            <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest mb-8">Institutional Terminal Access</p>
            <div class="space-y-4">
                <input type="text" id="username" placeholder="Username" class="w-full bg-slate-50 border border-slate-200 p-4 rounded-2xl text-sm outline-none">
                <input type="password" id="password" placeholder="Password" class="w-full bg-slate-50 border border-slate-200 p-4 rounded-2xl text-sm outline-none">
                <button onclick="handleLogin()" class="w-full bg-blue-600 py-4 rounded-2xl font-bold text-white uppercase text-xs">Login Terminal</button>
            </div>
        </div>
    </div>

    <aside id="sidebar" class="w-64 flex flex-col shrink-0">
        <div class="p-8 border-b border-slate-50">
            <h1 class="font-black italic text-blue-600 text-xl tracking-tighter">AISIGNALFX</h1>
        </div>
        <nav class="flex-1 pt-4">
            <div onclick="switchPage('page-dash', this)" class="nav-item nav-active"><i class="fas fa-th-large w-5"></i><span>Dashboard</span></div>
            <div onclick="switchPage('page-analysis', this)" class="nav-item"><i class="fas fa-chart-line w-5"></i><span>AI Analysis Signal</span></div>
            <div onclick="switchPage('page-autoscan', this)" class="nav-item"><i class="fas fa-robot w-5"></i><span>AI AutoScan VIP</span></div>
            <div onclick="switchPage('page-consisten', this)" class="nav-item text-orange-500 font-bold"><i class="fas fa-calendar-check w-5"></i><span>Jalur Profit 2026</span></div>
            <div id="admin-nav" class="hidden mt-4 border-t border-slate-100 pt-4">
                <div onclick="switchPage('page-admin', this)" class="nav-item text-red-600"><i class="fas fa-user-shield w-5"></i><span>Admin Master</span></div>
            </div>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col min-w-0 overflow-hidden relative">
        <header class="p-4 bg-white border-b flex justify-between items-center px-8 shadow-sm z-40">
            <button onclick="toggleMenu()" class="lg:hidden text-blue-600"><i class="fas fa-bars"></i></button>
            <div class="flex items-center gap-4">
                <div class="text-right">
                    <p id="display-name" class="text-[11px] font-800 text-slate-900 uppercase">Guest</p>
                </div>
                <div class="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center text-white"><i class="fas fa-user-astronaut"></i></div>
            </div>
        </header>

        <div class="ticker-wrap"><div class="ticker-move uppercase">XAUUSD: 2341.20 (+0.45%) • BTCUSDT: 67452.10 (-1.20%)</div></div>

        <div id="page-dash" class="page active">
            <div class="glass-card p-2 h-[400px] mb-6"><div id="tv-chart-box" class="w-full h-full"></div></div>
            <div class="glass-card p-6">
                <textarea id="post-desc" placeholder="Bagikan analisa Anda..." class="w-full bg-slate-50 border-none p-4 rounded-2xl text-xs outline-none mb-4" rows="3"></textarea>
                <div class="flex justify-end"><button onclick="handlePost()" class="bg-blue-600 text-white px-6 py-2 rounded-xl text-[10px] font-bold uppercase">Posting Analisa</button></div>
                <div id="social-feed" class="mt-6 pt-6 border-t border-slate-100"></div>
            </div>
        </div>

        <div id="page-analysis" class="page">...</div>
        <div id="page-autoscan" class="page">...</div>
        <div id="page-admin" class="page">...</div>
    </main>

    <script>
        // LOGIKA ASLI DARI FILE BOS
        const ACCESS_KEYS = { "psbetung": { pass: "admin123", role: "ADMIN", name: "PSBETUNG" } };
        
        function handleLogin() {
            const u = document.getElementById('username').value.toLowerCase();
            const p = document.getElementById('password').value;
            if (ACCESS_KEYS[u] && ACCESS_KEYS[u].pass === p) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('display-name').innerText = ACCESS_KEYS[u].name;
                if(ACCESS_KEYS[u].role === 'ADMIN') document.getElementById('admin-nav').classList.remove('hidden');
                initTV();
            } else { alert("Akses Ditolak!"); }
        }

        function handlePost() {
            const desc = document.getElementById('post-desc').value;
            if(!desc) return;
            const feed = document.getElementById('social-feed');
            const post = `<div class="bg-slate-50 p-4 rounded-2xl mb-4 text-xs font-bold uppercase italic">${desc}</div>`;
            feed.innerHTML = post + feed.innerHTML;
            document.getElementById('post-desc').value = "";
        }

        function initTV() { new TradingView.widget({"autosize": true, "symbol": "OANDA:XAUUSD", "interval": "15", "theme": "light", "container_id": "tv-chart-box"}); }
        function switchPage(id, el) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('nav-active'));
            el.classList.add('nav-active');
        }
        function toggleMenu() { document.getElementById('sidebar').classList.toggle('open'); }
    </script>
</body>
</html>
