<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI SIGNALFX LOGIN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #06090f; color: #cbd5e1; font-family: sans-serif; }
        .panel-glow { border: 1px solid #1e293b; background: #0f172a; }
        .hidden { display: none; }
    </style>
</head>
<body class="h-screen flex items-center justify-center p-4">

    <!-- FORM LOGIN -->
    <div id="login-screen" class="w-full max-w-sm panel-glow p-8 rounded-xl shadow-2xl">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-blue-500">AI SIGNALFX</h1>
            <p class="text-xs text-slate-500 mt-2">Masukan akun untuk akses dashboard</p>
        </div>
        
        <div class="space-y-4">
            <div>
                <label class="text-[10px] uppercase font-bold text-slate-500">Username</label>
                <input type="text" id="username" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-lg text-sm mt-1 focus:border-blue-500 outline-none">
            </div>
            <div>
                <label class="text-[10px] uppercase font-bold text-slate-500">Password</label>
                <input type="password" id="password" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-lg text-sm mt-1 focus:border-blue-500 outline-none">
            </div>
            <p id="error-msg" class="text-red-500 text-[11px] hidden text-center">Username atau Password salah!</p>
            <button onclick="handleLogin()" class="w-full bg-blue-600 hover:bg-blue-700 p-3 rounded-lg text-sm font-bold transition-all text-white mt-4">MASUK</button>
        </div>
        
        <p class="text-[10px] text-center text-slate-600 mt-8">&copy; 2026 AI SIGNALFX - Psbetungputra-Cyber</p>
    </div>

    <!-- MAIN DASHBOARD (HIDDEN BY DEFAULT) -->
    <div id="main-app" class="hidden fixed inset-0 flex flex-col">
        <!-- Header -->
        <header class="h-[55px] px-4 border-b border-slate-800 bg-[#0f172a] flex justify-between items-center shrink-0">
            <span class="text-blue-500 font-bold text-sm">AI SIGNALFX <span class="text-white text-[10px]">V1</span></span>
            <button onclick="logout()" class="text-[10px] bg-red-900/20 text-red-500 px-3 py-1 rounded border border-red-900/30 font-bold uppercase">Keluar</button>
        </header>

        <div class="flex flex-grow overflow-hidden">
            <!-- Sidebar Nav -->
            <nav class="w-16 lg:w-56 bg-[#0f172a] border-r border-slate-800 flex flex-col p-2 gap-1">
                <button onclick="showPage('dashboard')" class="p-3 text-left hover:bg-slate-800 rounded text-xs lg:text-sm font-medium text-white" id="btn-dashboard">📊 <span class="hidden lg:inline ml-2">Dashboard</span></button>
                <!-- Tombol Admin ini nanti cuma muncul kalau login sebagai admin -->
                <button id="admin-nav-btn" onclick="showPage('admin')" class="p-3 text-left hover:bg-slate-800 rounded text-xs lg:text-sm font-medium text-slate-400 hidden">⚙️ <span class="hidden lg:inline ml-2">Admin Panel</span></button>
            </nav>

            <!-- Content Area -->
            <main class="flex-grow bg-[#06090f] relative overflow-y-auto">
                <!-- Page: Dashboard -->
                <div id="page-dashboard" class="h-full flex flex-col">
                    <div class="p-2 border-b border-slate-800 flex gap-2 overflow-x-auto bg-[#0f172a]">
                        <div class="panel-glow p-2 rounded shrink-0 min-w-[120px]">
                            <p class="text-[8px] text-slate-500 uppercase font-bold tracking-tighter">Market Trend</p>
                            <p class="text-[11px] font-mono text-blue-400">BOS CONFIRMED</p>
                        </div>
                        <div class="panel-glow p-2 rounded shrink-0 min-w-[120px]">
                            <p class="text-[8px] text-slate-500 uppercase font-bold tracking-tighter">AI Confidence</p>
                            <p class="text-[11px] font-mono text-green-400">92% ACCURACY</p>
                        </div>
                    </div>
                    <div class="flex-grow relative bg-black">
                        <div id="tradingview_pro" class="absolute inset-0"></div>
                    </div>
                </div>

                <!-- Page: Admin -->
                <div id="page-admin" class="hidden p-6">
                    <div class="max-w-2xl mx-auto">
                        <h2 class="text-lg font-bold mb-4 border-b border-slate-800 pb-2 text-white italic">ADMIN CONTROL PANEL</h2>
                        <div class="grid grid-cols-1 gap-4">
                            <div class="panel-glow p-5 rounded-xl">
                                <h3 class="text-xs font-bold text-slate-400 mb-4 uppercase">Update Sinyal Market</h3>
                                <div class="space-y-3">
                                    <input type="text" placeholder="Entry Price (ex: 2345.50)" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-lg text-sm outline-none focus:border-blue-500">
                                    <select class="w-full bg-slate-900 border border-slate-700 p-3 rounded-lg text-sm outline-none focus:border-blue-500">
                                        <option>SELL SETUP</option>
                                        <option>BUY SETUP</option>
                                    </select>
                                    <button class="w-full bg-blue-600 p-3 rounded-lg text-sm font-bold hover:bg-blue-700 shadow-lg shadow-blue-900/20">Kirim Sinyal</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        // SETTING LOGIN (Ganti di sini bro)
        const ADMIN_USER = "admin";
        const ADMIN_PASS = "bro123"; // Ganti password-mu di sini

        function handleLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');

            if (user === ADMIN_USER && pass === ADMIN_PASS) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                document.getElementById('admin-nav-btn').classList.remove('hidden'); // Munculkan menu admin
                initChart();
            } else {
                errorMsg.classList.remove('hidden');
            }
        }

        function logout() {
            location.reload(); // Refresh halaman untuk logout aman
        }

        function showPage(pageId) {
            ['dashboard', 'admin'].forEach(p => {
                document.getElementById('page-' + p).classList.add('hidden');
            });
            document.getElementById('page-' + pageId).classList.remove('hidden');
        }

        function initChart() {
            new TradingView.widget({
                "autosize": true,
                "symbol": "OANDA:XAUUSD",
                "interval": "H1",
                "timezone": "Asia/Jakarta",
                "theme": "dark",
                "style": "1",
                "locale": "id",
                "toolbar_bg": "#0f172a",
                "enable_publishing": false,
                "hide_side_toolbar": false,
                "allow_symbol_change": true,
                "container_id": "tradingview_pro"
            });
        }
    </script>
</body>
</html>
