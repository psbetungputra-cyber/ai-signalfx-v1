<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AiSignalFx Pro v12.0 - Institutional Terminal</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://s3.tradingview.com/tv.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        :root { 
            --bg-dark: #0b0e11; 
            --sidebar-bg: #161a1e; 
            --card-bg: #1e2329;
            --accent-blue: #3b82f6; 
            --accent-gold: #f59e0b;
            --text-gray: #848e9c;
            --border: #2b3139;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: var(--bg-dark); 
            color: #ffffff; 
            height: 100vh;
            overflow: hidden;
        }

        /* Scrollbar Styling Custom */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

        /* Login Interface (Style v2) */
        #login-screen {
            background: radial-gradient(circle at top right, #1e2329 0%, #0b0e11 100%);
            display: flex; align-items: center; justify-content: center;
        }

        .input-pro {
            background: #1e2329;
            border: 1px solid var(--border);
            color: white;
            transition: all 0.3s ease;
        }

        .input-pro:focus {
            border-color: var(--accent-blue);
            background: #2b3139;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.1);
            outline: none;
        }

        /* Layout Main App */
        #app-content { display: none; height: 100vh; width: 100%; position: relative; }
        
        /* Animasi Transisi Halaman */
        .page { display: none; height: 100vh; overflow-y: auto; padding-bottom: 100px; animation: slideUp 0.4s ease-out; }
        .page.active { display: block; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Glassmorphism Cards */
        .glass-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <div id="login-screen" class="fixed inset-0 z-[9999]">
        <div class="w-full max-w-md p-8 bg-[#161a1e] border border-[#2b3139] rounded-[40px] shadow-2xl mx-4">
            <div class="text-center mb-10">
                <div class="w-20 h-20 bg-blue-600/10 rounded-3xl flex items-center justify-center mx-auto mb-4 border border-blue-600/20">
                    <i class="fas fa-microchip text-blue-500 text-3xl"></i>
                </div>
                <h1 class="text-2xl font-800 italic tracking-tighter text-blue-500 uppercase">AiSignalFx <span class="text-white">PRO</span></h1>
                <p class="text-[10px] font-bold text-gray-500 uppercase tracking-[5px] mt-2">Institutional Access Only</p>
            </div>

            <div class="space-y-6">
                <div>
                    <label class="text-[10px] font-black text-gray-500 uppercase tracking-widest ml-4 mb-2 block">Terminal ID</label>
                    <input type="text" id="username" class="input-pro w-full p-4 rounded-2xl text-sm font-bold" placeholder="MASTER / GUEST ID">
                </div>
                <div>
                    <label class="text-[10px] font-black text-gray-500 uppercase tracking-widest ml-4 mb-2 block">Secure Password</label>
                    <input type="password" id="password" class="input-pro w-full p-4 rounded-2xl text-sm" placeholder="••••••••">
                </div>
                
                <button onclick="unlockTerminal()" class="w-full bg-blue-600 hover:bg-blue-500 py-4 rounded-2xl font-800 text-white uppercase text-xs tracking-widest transition-all shadow-lg shadow-blue-600/20">
                    Buka Terminal <i class="fas fa-lock-open ml-2"></i>
                </button>
            </div>
            
            <div class="mt-8 flex justify-center gap-4 border-t border-[#2b3139] pt-6">
                <p class="text-[9px] text-gray-600 font-bold uppercase italic tracking-tighter">Encrypted v12.0</p>
                <p class="text-[9px] text-gray-600 font-bold uppercase italic tracking-tighter">•</p>
                <p class="text-[9px] text-gray-600 font-bold uppercase italic tracking-tighter">Firebase Active</p>
            </div>
        </div>
    </div>

    <div id="app-content" class="flex flex-col lg:flex-row">
        <div id="sidebar-target"></div>
        <div id="main-content-target" class="flex-1 relative overflow-hidden">
             </div>
    </div>

    <script>
        // DATA AKSES (Logika Versi 1)
        const MASTER_KEYS = {
            "psbetung": { pass: "admin123", role: "ADMIN", name: "PSBETUNG", status: "MASTER", avatar: "P" },
            "trader": { pass: "pro123", role: "VIP", name: "PREMIUM USER", status: "ACTIVE", avatar: "V" }
        };

        let userSession = null;

        function unlockTerminal() {
            const u = document.getElementById('username').value.toLowerCase();
            const p = document.getElementById('password').value;

            if (MASTER_KEYS[u] && MASTER_KEYS[u].pass === p) {
                userSession = MASTER_KEYS[u];
                
                // Animasi Transisi Keluar Login
                const login = document.getElementById('login-screen');
                login.style.transition = '0.5s';
                login.style.opacity = '0';
                login.style.transform = 'scale(1.1)';
                
                setTimeout(() => {
                    login.style.display = 'none';
                    document.getElementById('app-content').style.display = 'flex';
                    console.log("Terminal Unlocked for: " + userSession.name);
                    
                    // Modul 02 akan memanggil inisialisasi di sini
                    if(typeof initApp === "function") initApp();
                }, 500);
            } else {
                alert("ACCESS DENIED: Credentials Invalid!");
            }
        }
    </script>
</body>
</html>
